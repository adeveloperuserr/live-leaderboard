services:
  redis:
    image: redis:7-alpine
    container_name: live-leaderboard-redis
    ports:
      - "6379:6379"
    volumes:
      - live-leaderboard-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  live-leaderboard-redis-data:
